aid: sch-ttflix
name: Schüttflix
description: >-
  Schüttflix is a Gütersloh, Germany based digital logistics platform for the
  construction industry, describing itself as the first digital logistics hub to
  connect construction companies, building-material suppliers, disposal companies
  and carriers. The marketplace digitizes the full workflow from ordering bulk
  materials (sand, gravel, crushed stone) through transport dispatch to the
  delivery note, and adds construction-waste disposal and circular-economy
  recycling services. Schüttflix operates as a neutral marketplace ("we don't
  compete, we connect") spanning 4,000+ suppliers and disposers, 6,800+ partner
  carriers and 33,000+ vehicles, delivered primarily through native iOS and
  Android apps rather than a public API. It is a portfolio company of HV Capital,
  added to the API Evangelist network for enrichment.
